<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <title>CSS Box Model</title>

  <style>
    
    .box {
      width: 400px;
      height: 400px;
      border: 20px solid black;
      box-sizing: border-box;
    }

    .box1 {
      background-color: cadetblue;
      padding: 20px;
    }

    .box2 {
      background-color: gold;
      margin-left: 480px;
    }

    .box3 {
      background-color: indianred;
      margin-left: 80px;
    }

  </style>
</head>

<body>

  <div class="box box1">
    <p>
      Lorem ipsum dolor sit amet consectetur adipisicing elit.
      Quidem incidunt numquam expedita labore nulla eligendi harum.
      Hic fugit, explicabo ipsam suscipit enim, quisquam est excepturi dolores, sunt voluptatum deserunt dolore?
    </p>
  </div>
 
  <div class="box box2"></div>
  <div class="box box3"></div>
</body>

</html>
